.keybtn.off .lamp{background:#B4472F}
.keyform{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.keyform input{font-family:var(--mono);font-size:13px;direction:ltr;text-align:left;padding:12px}
.hd .step{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-60);direction:ltr}
.rail{display:flex;gap:4px;padding-bottom:4px}
.rail button{flex:1;border:0;background:none;padding:4px 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rail button[disabled]{cursor:default}
.rail button i{display:block;height:2px;background:var(--ink-12);border-radius:2px;transition:background .3s}
.rail button.on i{background:var(--brown)}
.rail button.here i{height:4px;margin-top:-1px}
.rail button:focus-visible{outline:2px solid var(--brown);outline-offset:2px}

/* ---------- sections ---------- */
section{padding:22px 0 6px;border-bottom:1px solid var(--ink-12)}
section:last-of-type{border-bottom:0}
section[hidden]{display:none}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.num{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--brown);color:var(--paper);padding:3px 7px;direction:ltr}
.eyebrow h2{font-size:16px;font-weight:600;margin:0}
.eyebrow .hint{margin-inline-start:auto;font-size:12px;color:var(--ink-60)}

textarea,input[type=text]{
  width:100%;font-family:var(--sans);font-size:17px;line-height:1.85;
  color:var(--brown);background:var(--white);
  border:1px solid var(--ink-12);border-radius:0;padding:16px;resize:vertical;
  transition:border-color .2s,box-shadow .2s;
}
textarea{min-height:172px}
textarea:focus,input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(63,45,43,.10)}
.meta{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-60)}
.meta .num-en{direction:ltr;unicode-bidi:embed}
.linkbtn{background:none;border:0;padding:6px 0;font-family:var(--sans);font-size:13px;color:var(--ink-60);
  cursor:pointer;text-decoration:underline;text-underline-offset:4px;margin-inline-start:auto}
.linkbtn:hover{color:var(--brown)}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  min-height:56px;padding:0 20px;border:0;cursor:pointer;
  font-family:var(--sans);font-size:16px;font-weight:600;
  background:var(--brown);color:var(--paper);transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.988)}
.btn[hidden]{display:none}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--brown)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.sm{min-height:48px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- sticky bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(to top,var(--paper) 72%,rgba(237,237,237,0));
  padding:14px var(--pad) calc(14px + env(safe-area-inset-bottom))}
.bar .wrap{padding:0}
.bar .row{display:flex;gap:10px}
.bar .row .btn{flex:1}
.bar .row .btn.back{flex:0 0 104px;font-size:15px}

/* ---------- chips / segmented ---------- */
.seg{display:flex;border:1px solid var(--ink-12);background:var(--white);margin-bottom:14px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:none;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-60);border-inline-end:1px solid var(--ink-12)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-selected=true]{background:var(--brown);color:var(--paper)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg.metal button[aria-selected=true][data-theme=gold]{background:linear-gradient(105deg,#8F5F1C,#E8B238 28%,#FBEBC0 48%,#D89F2A 72%,#A9711D);color:#3F2D2B}
.seg.metal button[aria-selected=true][data-theme=silver]{background:linear-gradient(105deg,#8A8E92,#D9DCDE 28%,#FFFFFF 48%,#C2C6C9 72%,#8E9296);color:#2A2A2A}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--ink-30);background:transparent;cursor:pointer;padding:9px 15px;
  font-family:var(--sans);font-size:14px;color:var(--brown)}
.chip[aria-pressed=true]{background:var(--brown);color:var(--paper);border-color:var(--brown)}
.field-label{font-size:13px;font-weight:500;color:var(--ink-60);display:block;margin:0 0 8px}

/* ---------- cards / issues ---------- */
.card{background:var(--white);border:1px solid var(--ink-12);padding:14px;margin-bottom:14px}
.card .cap{font-size:12px;color:var(--ink-60);margin-bottom:8px}
.card .ar{font-size:16px;line-height:1.9}
.card .spec{font-family:var(--mono);font-size:12px;line-height:2;color:var(--ink-60);direction:ltr;text-align:right}
.issues{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.issue{font-size:12px;border:1px solid var(--ink-30);padding:5px 10px;color:var(--ink-60)}
.issue.clean{border-color:var(--brown);color:var(--brown)}

/* ---------- states ---------- */
.note{display:flex;gap:12px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.7;
  border-inline-start:3px solid var(--gold);background:rgba(232,178,56,.14)}
.note.err{border-color:#8A2B2B;background:rgba(138,43,43,.10)}
.note b{display:block;font-weight:600;margin-bottom:2px}
.note .why{display:block;margin-top:8px;padding:8px 10px;background:rgba(63,45,43,.07);
  font-family:var(--mono);font-size:11px;line-height:1.6;direction:ltr;text-align:left;
  word-break:break-word;color:var(--ink-60)}
.note .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.loading{display:flex;align-items:center;gap:12px;padding:26px 0;font-size:14px;color:var(--ink-60)}
.pulse{width:9px;height:9px;background:var(--gold);border-radius:50%;animation:p 1.1s infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.skel{height:12px;background:var(--ink-12);margin-bottom:9px;animation:p 1.4s infinite}

/* ---------- preview ---------- */
.frame{background:var(--char);padding:14px;display:flex;justify-content:center;margin-bottom:14px}
.frame img{display:block;width:100%;height:auto;max-height:66vh;object-fit:contain}
.frame.story img{max-width:290px}
.tip{font-size:12px;color:var(--ink-60);text-align:center;margin:-6px 0 16px}
.done{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brown);margin-bottom:10px}
.done .dot{width:8px;height:8px;background:var(--gold)}
footer{padding:26px 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-30);
  text-transform:uppercase;display:flex;justify-content:space-between;direction:ltr}
canvas{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo" role="img" aria-label="MSA"></div>
      <span class="div"></span>
      <span class="name" style="white-space:nowrap">غرفة الأخبار</span>
      <button class="keybtn" id="keyBtn" type="button" aria-label="مفتاح التحرير">
        <span class="lamp" id="keyLamp"></span>المحرّر
      </button>
      <span class="step" id="stepLabel">01 / 04</span>
    </div>
    <nav class="rail" id="rail" aria-label="خطوات الرحلة">

      <button type="button" data-step="2" aria-label="الخطوة 2 — مراجعة النص"><i></i></button>
      <button type="button" data-step="3" aria-label="الخطوة 3 — توليد التصاميم"><i></i></button>
      <button type="button" data-step="4" aria-label="الخطوة 4 — المعاينة"><i></i></button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- 01 -->
  <section id="s1">
    <div class="eyebrow"><span class="num">01</span><h2>الخبر العاجل</h2><span class="hint" id="count">0 كلمة</span></div>
    <textarea id="raw" lang="ar" placeholder="الصق نص الخبر العاجل هنا…" aria-label="نص الخبر العاجل"></textarea>
    <div class="meta">
      <span id="countLong"></span>
      <button class="linkbtn" id="clear" type="button">مسح</button>
    </div>
  </section>

  <!-- 02 -->
  <section id="s2" hidden>
    <div class="eyebrow"><span class="num">02</span><h2>مراجعة النص</h2></div>
    <div id="s2body"></div>
  </section>

  <!-- 03 -->
  <section id="s3" hidden>
    <div class="eyebrow"><span class="num">03</span><h2>توليد التصاميم</h2></div>

    <label class="field-label">تصنيف الخبر</label>
    <div class="chips" id="labelChips"></div>

    <label class="field-label" for="detail">سطر التفاصيل — اختياري</label>
    <input type="text" id="detail" lang="ar" placeholder="مصدر الخبر أو تفصيلة إضافية" maxlength="90">
    <div class="meta"><span id="detailCount">0 من 90 حرفًا</span></div>

    <label class="field-label" style="margin-top:20px">المعدن</label>
    <div class="seg metal" id="themeSeg" role="tablist">
      <button role="tab" data-theme="gold" aria-selected="true">ذهب</button>
      <button role="tab" data-theme="silver" aria-selected="false">فضة</button>
    </div>

    <div class="card">
      <div class="cap">المخرجات</div>
      <div class="spec">Instagram Story — 1080 × 1920<br>Instagram Post — 1080 × 1080</div>
    </div>
  </section>

  <!-- 04 -->
  <section id="s4" hidden>
    <div class="eyebrow"><span class="num">04</span><h2>المعاينة</h2></div>
    <div class="seg" id="fmtSeg" role="tablist">
      <button role="tab" data-fmt="story" aria-selected="true">ستوري 9:16</button>
      <button role="tab" data-fmt="post" aria-selected="false">بوست 1:1</button>
    </div>
    <div class="frame story" id="frame"><img id="preview" alt="معاينة التصميم"></div>
    <p class="tip">اضغط مطولًا على الصورة لحفظها، أو استخدم الأزرار بالأسفل.</p>
    <div id="saved"></div>
    <button class="btn gold" id="dlBoth" type="button" style="margin-bottom:10px">تحميل الستوري والبوست</button>
    <div class="grid2" style="margin-bottom:10px">
      <button class="btn sm ghost" id="dlStory" type="button">تحميل الستوري</button>
      <button class="btn sm ghost" id="dlPost" type="button">تحميل البوست</button>
    </div>
    <div class="grid2" style="margin-bottom:10px">
      <button class="btn sm ghost" id="regen" type="button">إعادة التوليد</button>
      <button class="btn sm ghost" id="editCopy" type="button">تعديل النص</button>
    </div>
    <button class="btn sm ghost" id="backSettings" type="button" style="margin-bottom:10px">رجوع لإعدادات التصميم</button>
    <button class="linkbtn" id="startNew" type="button" style="width:100%;text-align:center;margin:0">البدء من جديد</button>
  </section>

  <footer><span>@MSA.EGY</span><span>Confidence in every step</span></footer>
</main>

<div class="bar" id="bar"><div class="wrap"><div class="row">
  <button class="btn ghost back" id="back" type="button" hidden>رجوع</button>
  <button class="btn" id="cta" type="button">تحليل وتصحيح</button>
</div></div></div>

const tintCache = new Map();
function tinted(img, color){
  const key = img.src.slice(-24) + color;
  if (tintCache.has(key)) return tintCache.get(key);
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || 1; c.height = img.naturalHeight || 1;
  const x = c.getContext('2d');
  x.drawImage(img,0,0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color; x.fillRect(0,0,c.width,c.height);
  tintCache.set(key,c);
  return c;
}
function grad(ctx, stops, x0,y0,x1,y1){
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}

/* Read from the <meta name="msa-proxy-url"> tag at the top of this file. */
const PROXY_URL = (document.querySelector('meta[name="msa-proxy-url"]') || {}).content || "";

/* Two ways to reach the editor:
   1. running inside Claude — the host injects credentials, no key needed;
   2. running as a standalone page — the browser needs an API key of your own,
      sent with the direct-browser-access header that Anthropic requires for CORS. */
function apiError(kind, status, detail){
  const e = new Error(kind + (status?(' '+status):''));
  e.kind = kind; e.status = status; e.detail = detail;
  return e;
}
async function callClaude(prompt, maxTokens){
  const headers = {"Content-Type":"application/json"};
  let url = "https://api.anthropic.com/v1/messages";
  if (S.apiKey){                                    // personal key wins
    headers["x-api-key"] = S.apiKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  } else if (PROXY_URL){                            // team proxy holds the key
    url = PROXY_URL;
  }
  let r;
  try{
    r = await fetch(url,{
      method:"POST", headers,
      body: JSON.stringify({ model:MODEL, max_tokens:maxTokens||1000,
        messages:[{role:"user",content:prompt}] })
    });
  }catch(e){ throw apiError('network'); }          // blocked by CORS / offline
  if (!r.ok){
    const body = await r.text().catch(()=>'');
    if (r.status===401 || r.status===403) throw apiError('auth', r.status, body);
    if (r.status===429) throw apiError('rate', r.status, body);
    throw apiError('http', r.status, body);
  }
  const data = await r.json();
  S.connected = true; paintKeyBtn();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function parseJSON(txt){
  const clean = txt.replace(/```json|```/g,'').trim();
  const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
  return JSON.parse(s>=0 ? clean.slice(s,e+1) : clean);
}
function localTidy(t){
  return t.replace(/\s+/g,' ').replace(/\s+([،.,!؟?:؛])/g,'$1')
          .replace(/([،,؛])(?=\S)/g,'$1 ').replace(/\.{3,}/g,'…').trim();
}
async function analyze(text){
  const j = parseJSON(await callClaude(PROMPT(text), 1200));
  return {
    corrected: (j.corrected||'').trim() || localTidy(text),
    paraphrased: (j.paraphrased||'').trim() || '',
    issues: Array.isArray(j.issues) ? j.issues.slice(0,6) : []
  };
}
async function condense(text, limit){
  const p = `اختصر خبر إنستجرام التالي إلى أقل من ${limit} حرفًا مع الحفاظ على كل الحقائق الأساسية (الأرقام والأسماء والأماكن). أسلوب خبري محايد، بدون إيموجي وبدون مبالغة. لا تختلق أي معلومة.\n\n"""${text}"""\n\nأعد النص المختصر فقط بدون أي شرح.`;
  return (await callClaude(p, 500)).replace(/^["'\s]+|["'\s]+$/g,'').trim();
}

/* ---------- 4. template renderer --------------------------------------- */
const SPEC = {
  story:{ W:1080, H:1920, M:88, band:[430,1560], sizes:[104,96,88,80,72,64,58],
          maxLines:5, logoW:250, capSize:23, tag:36, detail:34, foot:1748, rule:1690, gridTop:340 },
  post: { W:1080, H:1080, M:76, band:[276,836],  sizes:[92,84,76,68,60,54],
          maxLines:4, logoW:212, capSize:21, tag:32, detail:30, foot:966,  rule:918, gridTop:236 }
};

function greedy(ctx, words, avail){
  const lines = []; let cur = '';
  for (const w of words){
    const test = cur ? cur+' '+w : w;
    if (ctx.measureText(test).width <= avail) cur = test;
    else if (!cur) return null;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
/* largest size that fits, then balance the ragged edge */
function fitHeadline(ctx, text, spec){
  const words = text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  const maxW = spec.W - spec.M*2;
  for (const size of spec.sizes){
    const padX = Math.round(size*0.34);
    const avail = maxW - padX*2;
    ctx.font = `700 ${size}px Alexandria, sans-serif`;
    const lines = greedy(ctx, words, avail);
    if (!lines || lines.length > spec.maxLines) continue;
    let best = lines;
    for (let f=0.95; f>=0.55; f-=0.05){
      const t = greedy(ctx, words, avail*f);
      if (t && t.length === lines.length) best = t; else break;
    }
    return {size, lines:best, padX};
  }
  return null;
}
function wrapPlain(ctx, text, font, maxW, maxLines){
  ctx.font = font;
  const words = text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  let lines = greedy(ctx, words, maxW) || [text];
  for (let f=0.95; f>=0.55; f-=0.05){
    const t = greedy(ctx, words, maxW*f);
    if (t && t.length === lines.length) lines = t; else break;
  }
  return lines.slice(0, maxLines);
}

function render(fmt){
  const spec = SPEC[fmt], T = THEME[S.theme];
  const cv = document.getElementById('cv');
  cv.width = spec.W; cv.height = spec.H;
  const ctx = cv.getContext('2d');
  ctx.textBaseline = 'alphabetic';

  /* metal background */
  ctx.fillStyle = grad(ctx, T.bgStops, 0, 0, spec.W, spec.H);
  ctx.fillRect(0,0,spec.W,spec.H);

  /* monogram texture, kept very quiet */
  if (LOGO_MONO.complete && LOGO_MONO.naturalWidth){
    const mw = spec.W*0.78, mh = mw*LOGO_MONO.naturalHeight/LOGO_MONO.naturalWidth;
    ctx.drawImage(tinted(LOGO_MONO,T.mark), -mw*0.22, spec.H - mh*0.72, mw, mh);
  }

  const R = spec.W - spec.M, L = spec.M;

  const fit = fitHeadline(ctx, S.final, spec);
  if (!fit) return null;

  const lineH = Math.round(fit.size*1.50);
  const gap   = Math.round(fit.size*0.11);
  const tagH  = Math.round(spec.tag*2.05);

  let detailLines = [];
  const detailFont = `400 ${spec.detail}px Alexandria, sans-serif`;
  if (S.detail.trim()) detailLines = wrapPlain(ctx, S.detail.trim(), detailFont, spec.W-spec.M*2-20, 2);

  const blockH = tagH + Math.round(fit.size*0.42)
               + fit.lines.length*lineH + (fit.lines.length-1)*gap
               + (detailLines.length ? 46 + detailLines.length*Math.round(spec.detail*1.6) : 0);
  const top = Math.round(spec.band[0] + (spec.band[1]-spec.band[0]-blockH)/2);

  /* technical grid */
  const gx = Math.round(spec.W*0.235);
  ctx.strokeStyle = T.rule; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(gx+.5, spec.gridTop); ctx.lineTo(gx+.5, spec.rule); ctx.stroke();

  const headTop = top + tagH + Math.round(fit.size*0.42);
  const headBot = headTop + fit.lines.length*lineH + (fit.lines.length-1)*gap;
  [headTop, headBot].forEach(y=>{
    ctx.beginPath(); ctx.moveTo(L, y+.5); ctx.lineTo(R, y+.5); ctx.stroke();
  });
  [headTop, headBot].forEach(y=>{
    ctx.beginPath(); ctx.arc(gx, y, 9, 0, Math.PI*2);
    ctx.fillStyle = T.bgStops[1][1]; ctx.fill(); ctx.stroke();
  });

  ctx.direction = 'rtl';

  /* news label */
  ctx.font = `700 ${spec.tag}px Alexandria, sans-serif`;
  const tagW = ctx.measureText(S.label).width + spec.tag*1.5;
  ctx.fillStyle = T.tagBg;
  ctx.fillRect(R-tagW, top, tagW, tagH);
  ctx.fillStyle = T.tagInk;
  ctx.textAlign = 'right';
  ctx.fillText(S.label, R - spec.tag*0.75, top + tagH*0.5 + spec.tag*0.36);
  ctx.beginPath(); ctx.arc(R-tagW-spec.tag*0.9, top+tagH*0.5, spec.tag*0.22, 0, Math.PI*2);
  ctx.fillStyle = T.dot; ctx.fill();

  /* headline slabs, each poured with its own metal gradient */
  ctx.font = `700 ${fit.size}px Alexandria, sans-serif`;
  let y = headTop;
  for (const line of fit.lines){
    const w = ctx.measureText(line).width + fit.padX*2;
    ctx.fillStyle = grad(ctx, T.slabStops, R-w, y, R, y+lineH);
    ctx.fillRect(R-w, y, w, lineH);
    ctx.fillStyle = T.slabInk;
    ctx.fillText(line, R - fit.padX, y + lineH*0.5 + fit.size*0.36);
    y += lineH + gap;
  }

  /* detail line */
  if (detailLines.length){
    ctx.font = detailFont; ctx.fillStyle = T.soft;
    let dy = headBot + 46 + spec.detail;
    for (const dl of detailLines){ ctx.fillText(dl, R, dy); dy += Math.round(spec.detail*1.6); }
  }

  /* --- brand furniture --- */
  ctx.direction = 'ltr'; ctx.textAlign = 'left';

  if (LOGO_WORD.complete && LOGO_WORD.naturalWidth){
    const lw = spec.logoW, lh = lw*LOGO_WORD.naturalHeight/LOGO_WORD.naturalWidth;
    ctx.drawImage(tinted(LOGO_WORD,T.ink), L, spec.M*1.55, lw, lh);
  }

  const cs = spec.capSize;
  ctx.font = `400 ${cs}px "Space Mono", monospace`;
  ctx.fillStyle = T.soft;
  const capTop = spec.M*1.62 + cs;
  const colB = Math.max(ctx.measureText(BRAND.caption.l1[1]).width,
                        ctx.measureText(BRAND.caption.l2[1]).width);
  const colAx = R - colB - cs*2.2;
  ctx.textAlign = 'right';
  ctx.fillText(BRAND.caption.l1[0], colAx, capTop);
  ctx.fillText(BRAND.caption.l2[0], colAx, capTop + cs*1.5);
  ctx.fillText(BRAND.caption.l1[1], R, capTop);
  ctx.fillText(BRAND.caption.l2[1], R, capTop + cs*1.5);

  ctx.strokeStyle = T.rule; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(L, spec.rule+.5); ctx.lineTo(R, spec.rule+.5); ctx.stroke();
  ctx.font = `700 ${cs}px "Space Mono", monospace`;
  ctx.fillStyle = T.soft;
  ctx.textAlign = 'left';  ctx.fillText(stamp(), L, spec.foot);
  ctx.textAlign = 'right'; ctx.fillText(BRAND.tagline, R, spec.foot);

  return cv.toDataURL('image/png');
}

function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}  —  ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function go(step){

  [1,2,3,4].forEach(i=>{ $('s'+i).hidden = (i!==step); });
  $('stepLabel').textContent = '0'+step+' / 04';

/* every step you have already reached stays reachable, in both directions */
function reachable(step){
  if (step === 1) return true;
  if (step === 2) return !!S.corrected;
  if (step === 3) return !!S.final.trim();
  if (step === 4) return !!(S.images.story && S.images.post);
  return false;
}
function syncRail(){
  [...$('rail').children].forEach(b=>{
    const n = +b.dataset.step;
    b.classList.toggle('on', n <= S.step);
    b.classList.toggle('here', n === S.step);
    b.disabled = !reachable(n);
    b.setAttribute('aria-current', n === S.step ? 'step' : 'false');
  });
}

/* Surfaces what the server actually said, so a failure is diagnosable
   instead of just "it didn't work". */
function whyFailed(err){
  if (!err) return '';
  if (err.kind === 'network') return 'NETWORK — request blocked or unreachable';
  let msg = '';
  try{
    const j = JSON.parse(err.detail || '');
    msg = (j.error && (j.error.message || j.error)) || j.message || '';
    if (typeof msg !== 'string') msg = JSON.stringify(msg);
  }catch(e){ msg = (err.detail || '').slice(0,300); }
  return ('HTTP ' + (err.status || '?') + (msg ? ' — ' + msg : '')).trim();
}
function withWhy(n, err){
  const why = whyFailed(err);
  if (why && n) n.querySelector('div').appendChild(el('span','why', escapeHTML(why)));
  return n;
}

async function runAnalyze(){
  S.raw = $('raw').value.trim();
  S.busy = true; $('cta').disabled = true;
  go(2); loading($('s2body'), 'جارٍ تحليل النص…');
  try{
    const res = await analyze(S.raw);
    S.analyzedFor = S.raw;
    S.corrected = res.corrected; S.paraphrased = res.paraphrased; S.issues = res.issues;
    S.version='corrected'; S.final=''; S._lastVersion=null;
    renderStep2();
  }catch(err){
    S.connected = false; paintKeyBtn();
    S.corrected = localTidy(S.raw); S.paraphrased=''; S.issues=[]; S.analyzedFor = S.raw;
    S.version='corrected'; S.final=''; S._lastVersion=null;
    renderStep2();
    const k = err && err.kind;
    if (k === 'network')
      keyPanel($('s2body'), 'التصحيح التلقائي غير متاح هنا',
        PROXY_URL
          ? 'المتصفح مش قادر يوصل لخادم الوكيل. اتأكد إن الـ Worker شغّال وإن دومين الصفحة مضاف في قائمة ALLOWED_ORIGINS عنده. تقدر مؤقتًا تستخدم مفتاحك الشخصي، أو تكمّل وتصحّح يدويًا.'
          : 'المتصفح مش قادر يوصل لخدمة التحرير من الصفحة دي. لو الأداة مفتوحة كملف مستقل، محتاجة مفتاح Anthropic API عشان تشتغل. الصق المفتاح هنا، أو كمّل وصحّح النص يدويًا — باقي الأداة شغّال عادي.');
    else if (k === 'auth')
      withWhy(keyPanel($('s2body'), 'المفتاح مرفوض',
        'الخدمة رفضت الطلب. لو بتستخدم الوكيل، غالبًا دومين الصفحة مش مضاف في ALLOWED_ORIGINS. لو بمفتاحك الشخصي، اتأكد إنه صالح.'), err);
    else if (k === 'rate')
      withWhy(note($('s2body'),'err','تجاوزت حد الاستخدام',
        'الخدمة رفضت الطلب مؤقتًا بسبب كثرة الطلبات. استنى شوية وأعد المحاولة.',
        [['إعادة المحاولة', ()=>runAnalyze(), 'gold']]), err);
    else
      withWhy(note($('s2body'),'err','تعذّر تحليل النص',
        'الخادم رد برسالة خطأ. التفاصيل تحت — غالبًا الرصيد أو المفتاح أو اسم الموديل. النص اتعمله ضبط مسافات وترقيم فقط ويمكنك تعديله والمتابعة.',
        [['إعادة المحاولة', ()=>runAnalyze(), 'gold']]), err);
  }finally{ S.busy=false; $('cta').disabled=false; }
}

async function generate(){
  go(4);
  [...$('s4').querySelectorAll('.note')].forEach(n=>n.remove());
  await fontsReady;

  const story = render('story'), post = render('post');

  if (!story || !post){
    go(3);
    const n = note($('s3'),'warn','النص أطول من مساحة التصميم',
      'لن يظهر هذا العنوان بحجم مقروء داخل التصميم. اختصره يدويًا، أو اترك المحرر ينتج صياغة أقصر تحافظ على نفس المعلومات.',
      [['اختصار مناسب للتصميم', async ()=>{
          n.remove();
          const t = el('div','loading','<span class="pulse"></span>جارٍ الاختصار…'); $('s3').prepend(t);
          try{
            S.final = await condense(S.final, SPEC.post.maxLines*42);
            t.remove(); generate();
          }catch(e){
            t.remove();
            note($('s3'),'err','تعذّر اختصار النص','عدّل النص يدويًا ثم أعد المحاولة.',[['تعديل النص',()=>go(2)]]);
          }
        },'gold'],
       ['تعديل النص', ()=>go(2)]]);
    return;
  }
  S.images.story = story; S.images.post = post;
  $('saved').innerHTML = '';
  showPreview();
}

$('cta').addEventListener('click', ()=>{
  if (S.busy) return;
  if (S.step===1){
    const v = $('raw').value.trim();
    if (v === S.analyzedFor && S.corrected){ S.raw = v; renderStep2(); go(2); }
    else runAnalyze();
  }
  else if (S.step===2){
    const v = ($('editor') ? $('editor').value : S.final).trim();
    if (!v) return;
    S.final = v; go(3);
  }
  else if (S.step===3) generate();
});

/* --- boot --- */
const fontsReady = (async ()=>{
  try{
    await Promise.all([
      document.fonts.load('700 100px Alexandria'),
      document.fonts.load('400 100px Alexandria'),
      document.fonts.load('700 100px "Space Mono"'),
      document.fonts.load('400 100px "Space Mono"')
    ]);
    await document.fonts.ready;
  }catch(e){}
})();

renderLabels();
paintKeyBtn();
go(1);
$('raw').dispatchEvent(new Event('input'));
</script>
</body>
